<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="title desc">
<title id="title">목행시장 전체 공간 43m × 18m · 파크골프 배치 안내도</title>
<desc id="desc">고객지원센터 전체 공간은 가로 43미터, 세로 18미터입니다. 골프장 세트는 반시계 방향으로 90도 회전한 아래쪽 개방형이며, 전체 공간과 같은 축척으로 가로 24미터, 세로 14미터, 코스 폭 6미터를 표시했습니다. 고객지원센터는 왼쪽 위, 휴게실 몽골부스 두 동은 왼쪽 아래에 있습니다. 건물과 부스의 개별 크기는 개념 표시입니다. 오른쪽 아래에서 출발하여 1~3홀은 홀컵 없이 이어서 치고, 왼쪽 아래 4홀의 유일한 홀컵에서 마칩니다. 중심선 진행 거리는 34미터이며 네 구간은 각각 8.5미터입니다. 펜스 높이는 50센티미터입니다.</desc>
